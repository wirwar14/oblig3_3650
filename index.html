<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainy Exam Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #01030a;
    --card: rgba(6,10,20,0.84);
    --card-next: rgba(12,22,42,0.9);
    --text: #a3adbd;
    --muted: #4d5869;
    --blue: #1e3a5f;
    --blue-bright: #5b84b8;
    --pale: #8c9bb0;
    --done: #3c4a5c;
    --line: #111c2e;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    font-family: "Special Elite", "Courier New", monospace;
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
    overflow-x: hidden;
  }

  /* ---------- cottagecore scene ---------- */
  #outside, #inside { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #outside { filter: brightness(0.9) saturate(1.05); }
  #inside { filter: brightness(0.82); }
  .twinkle { animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame 0.18s ease-in-out infinite alternate; }
  @keyframes flame { from { transform: scale(1,1) skewX(-3deg); } to { transform: scale(0.9,1.1) skewX(3deg); } }
  .glowpulse { animation: glowpulse 2.5s ease-in-out infinite; }
  @keyframes glowpulse { 0%,100% { opacity: 0.75; } 50% { opacity: 1; } }
  .steam { transform-box: fill-box; animation: steam 4s ease-in-out infinite; opacity: 0; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: 0.6; } 100% { opacity: 0; transform: translateY(-24px); } }
  .breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.06); } }
  .smoke { transform-box: fill-box; transform-origin: center; animation: smoke 6s linear infinite; opacity: 0; }
  @keyframes smoke { 0% { opacity: 0; transform: translate(0,0) scale(0.6); } 20% { opacity: 0.5; } 100% { opacity: 0; transform: translate(30px,-90px) scale(1.8); } }
  .drift { animation: cloudDrift 60s ease-in-out infinite alternate; }
  @keyframes cloudDrift { from { transform: translateX(-40px); } to { transform: translateX(60px); } }
  .mist { animation: mist 12s ease-in-out infinite alternate; }
  @keyframes mist { from { opacity: 0.5; } to { opacity: 1; } }
  .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 6s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }

  .zz { animation: zz 3s ease-in-out infinite; opacity: 0; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0,0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(18px,-40px); } }
  .swing { transform-box: fill-box; transform-origin: 50% 0%; animation: swing 5s ease-in-out infinite alternate; }
  @keyframes swing { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }

  /* ---------- atmosphere layers ---------- */
  /* blurred city lights seen through a rainy window */
  #bokeh { position: fixed; inset: 0; z-index: 0; pointer-events: none; filter: blur(14px); opacity: 0.55; }
  #bokeh span {
    position: absolute; border-radius: 50%;
    animation: glow 7s ease-in-out infinite;
  }
  @keyframes glow { 0%,100% { opacity: 0.9; } 50% { opacity: 0.4; } }
  #sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #hint { margin-top: 8px; font-size: 0.8rem; color: #8592a6; transition: opacity 1s; }
  #moon {  /* weak cold light from above, slowly fading in and out */
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse at 74% 85%, rgba(255,170,90,0.12), transparent 35%),
      radial-gradient(ellipse at 50% 0%, rgba(255,200,130,0.08), transparent 45%);
    animation: moon 9s ease-in-out infinite;
  }
  @keyframes moon { 0%,100% { opacity: 0.8; } 50% { opacity: 0.35; } }
  #grain {
    position: fixed; inset: -100px; z-index: 2; pointer-events: none; opacity: 0.08;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 0.6s steps(4) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0,0); } 25% { transform: translate(-30px,20px); }
    50% { transform: translate(20px,-40px); } 75% { transform: translate(-10px,30px); }
  }
  #vignette {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(12,8,6,0.6) 75%, #000 100%);
    opacity: 0.5; transition: opacity 2s;
  }
  #lightning { position: fixed; inset: 0; z-index: 4; pointer-events: none; background: #b8c8e0; opacity: 0; }
  #flash { position: fixed; inset: 0; z-index: 20; pointer-events: none; background: #0a1a33; opacity: 0; transition: opacity 0.3s; }

  .wrap { max-width: 720px; margin: 0 auto; position: relative; z-index: 10; }
  header {
    text-align: center; margin-bottom: 20px;
    background: rgba(4,8,16,0.72); border-radius: 16px; padding: 18px 16px 20px;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    box-shadow: 0 6px 30px rgba(0,0,0,0.5);
  }
  h1 {
    font-family: "IM Fell English", Georgia, serif; font-weight: 400;
    margin: 0 0 6px; font-size: 2.5rem; letter-spacing: 4px;
    color: var(--pale);
    text-shadow: 0 0 18px rgba(30,58,95,0.9), 0 0 2px #000;
    animation: flicker 9s infinite;
  }
  @keyframes flicker {
    0%, 90%, 100% { opacity: 0.9; }
    91% { opacity: 0.2; } 92% { opacity: 0.8; } 94% { opacity: 0.35; } 95% { opacity: 0.9; }
  }
  #clock {
    font-size: 3.2rem; font-weight: 700; letter-spacing: 4px;
    font-variant-numeric: tabular-nums;
    color: var(--pale);
    text-shadow: 0 0 14px rgba(70,110,160,0.35);
  }
  #date { color: #8592a6; }
  #date, .meter-label, #hint, #doomText { text-shadow: 0 1px 3px #000, 0 0 10px rgba(0,0,0,0.9); }
  #doomText {
    margin: 16px auto 0; max-width: 520px; min-height: 2.6em;
    font-style: italic; color: var(--blue-bright);
    transition: opacity 1.8s;
  }

  .meter { margin: 14px auto 0; max-width: 460px; }
  .meter-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: #8592a6; margin-bottom: 4px; }
  .meter-bar { height: 10px; background: #03070f; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  #meterFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #050d1c, var(--blue), var(--blue-bright));
    box-shadow: 0 0 10px var(--blue); transition: width 1s;
  }

  #soundBtn {
    margin-top: 18px;
    font-family: "IM Fell English", Georgia, serif; font-size: 1.15rem; letter-spacing: 1px;
    background: var(--blue); color: #cfd8e6;
    border: 1px solid #23395a; padding: 10px 22px; border-radius: 4px; cursor: pointer;
    box-shadow: 0 0 20px rgba(30,58,95,0.6);
  }
  #soundBtn.on { background: #050a14; color: var(--blue-bright); border-color: var(--blue); }
  #rainOnlyBtn {
    display: block; margin: 10px auto 0; background: none; border: 1px solid #23395a; color: #8592a6;
    font-family: inherit; font-size: 0.8rem; padding: 6px 14px; border-radius: 999px; cursor: pointer;
  }
  #rainOnlyBtn:hover { color: #cfd8e6; border-color: var(--blue-bright); }
  .soundPick { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; font-size: 0.85rem; color: #8592a6; white-space: nowrap; }
  .soundPick select { max-width: 70%; }
  .soundPick select {
    background: #02050b; color: #cfd8e6; border: 1px solid #23395a; border-radius: 6px;
    font-family: inherit; font-size: 0.9rem; padding: 6px 10px; cursor: pointer; color-scheme: dark;
  }


  /* ---------- exam cards ---------- */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 16px 18px; margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .card.next {
    background: var(--card-next); border: 1px solid var(--blue);
    animation: pulse 3.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 6px rgba(30,58,95,0.4); }
    50% { box-shadow: 0 0 28px rgba(70,110,160,0.55); }
  }
  .card.past { opacity: 0.28; filter: grayscale(1); }
  .info .code { font-weight: 700; color: var(--pale); }
  .info .name { color: var(--muted); font-size: 0.9rem; }
  .info .when { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .countdown { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 1.15rem; white-space: nowrap; }
  .countdown.soon { color: var(--blue-bright); text-shadow: 0 0 8px var(--blue); }
  .countdown.finished { color: var(--done); }
  .badge {
    display: inline-block; font-family: "IM Fell English", Georgia, serif; font-size: 0.8rem;
    background: var(--blue); color: #cfd8e6; padding: 1px 8px; border-radius: 3px;
    margin-left: 6px; vertical-align: middle; letter-spacing: 1px;
  }
  .del {
    background: none; border: 1px solid #23395a; color: #8592a6; border-radius: 4px;
    font-family: inherit; font-size: 0.8rem; cursor: pointer; padding: 6px 10px; flex-shrink: 0;
  }
  .del:hover { color: #cfd8e6; border-color: var(--blue-bright); background: rgba(30,58,95,0.4); }
  .tag {
    display: inline-block; font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase;
    border: 1px solid #2a3b55; color: #8592a6; padding: 1px 6px; border-radius: 3px;
    margin-left: 6px; vertical-align: middle;
  }
  .tag.appointment { border-color: #3c5a4a; color: #8fb3a0; }
  .quote {
    margin: 0 auto 24px; max-width: 620px; padding: 20px 26px;
    background: rgba(4,8,16,0.72); border-radius: 16px; text-align: center; cursor: pointer;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    box-shadow: 0 6px 30px rgba(0,0,0,0.4);
    transition: opacity 1.2s;
  }
  .quote.fading { opacity: 0; }
  #quoteText {
    margin: 0; font-family: "IM Fell English", Georgia, serif; font-style: italic;
    font-size: 1.3rem; line-height: 1.5; color: #b4c2d8;
  }
  #quoteAuthor {
    margin-top: 10px; font-family: "IM Fell English", Georgia, serif;
    color: #7d8aa0; font-size: 0.9rem; letter-spacing: 1px;
  }
  @media (max-width: 520px) { #quoteText { font-size: 1.1rem; } .quote { padding: 16px 18px; } }
  .countFilter { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; }
  .countFilter button {
    background: rgba(4,8,16,0.72); border: 1px solid #23395a; color: #8592a6; border-radius: 999px;
    font-family: inherit; font-size: 0.85rem; padding: 6px 14px; cursor: pointer;
  }
  .countFilter button.active { color: #cfd8e6; border-color: var(--blue-bright); background: rgba(30,58,95,0.6); }

  form {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 16px 18px; margin-top: 28px;
    display: grid; gap: 10px; grid-template-columns: 1fr 1fr;
  }
  form h2 { grid-column: 1 / -1; margin: 0; font-size: 1.15rem; font-family: "IM Fell English", Georgia, serif; font-weight: 400; color: var(--pale); letter-spacing: 1px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: #8592a6; }
  .field.wide { grid-column: 1 / -1; }
  select { cursor: pointer; }
  input, select, button.add {
    padding: 10px; border-radius: 4px; border: 1px solid var(--line);
    background: #02050b; color: var(--text); font-family: inherit; font-size: 1rem; width: 100%;
    color-scheme: dark;
  }
  button.add { grid-column: 1 / -1; background: var(--blue); color: #cfd8e6; border: none; cursor: pointer; font-weight: 700; }
  #error { grid-column: 1 / -1; color: var(--blue-bright); min-height: 1em; font-size: 0.9rem; }
  .empty { text-align: center; color: var(--muted); padding: 20px; }
  .reset { display: block; margin: 16px auto 0; background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-family: inherit; }

  .wrap { transition: opacity 0.8s; }
  body.watching .wrap { opacity: 0; pointer-events: none; }
  body.watching #vignette { opacity: 0.25 !important; }
  #watchBtn {
    position: fixed; right: 16px; bottom: 16px; z-index: 30;
    font-family: "IM Fell English", Georgia, serif; font-size: 1rem;
    background: rgba(4,8,16,0.75); color: #cfd8e6; border: 1px solid #23395a;
    padding: 10px 16px; border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #watchBtn:hover, #rainBtn:hover { background: rgba(20,40,70,0.85); }
  #rainBtn {
    position: fixed; left: 16px; bottom: 16px; z-index: 30;
    font-family: "IM Fell English", Georgia, serif; font-size: 1rem;
    background: rgba(4,8,16,0.75); color: #cfd8e6; border: 1px solid #23395a;
    padding: 10px 16px; border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }

  .shake { animation: shake 0.6s; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-3px,1px); } 50% { transform: translate(3px,-1px); } 75% { transform: translate(-2px,1px); }
  }

  @media (max-width: 520px) {
    #clock { font-size: 2.4rem; }
    h1 { font-size: 1.3rem; letter-spacing: 1px; white-space: nowrap; }
    form { grid-template-columns: 1fr; }
    .card { flex-wrap: wrap; }
    .countdown { text-align: left; }
  }
</style>
</head>

        <option value="appointment">Appointment</option>
      </select>
    </label>
    <label class="field">Title
      <input id="code" placeholder="e.g. MATH1000 or Dentist" required>
    </label>
    <label class="field wide">Details (optional)
      <input id="name" placeholder="e.g. course name or place">
    </label>
    <label class="field">Date
      <input id="day" type="date" required>
    </label>
    <label class="field">Time
      <input id="time" type="time" value="09:00" required>
    </label>
    <div id="error"></div>
    <button class="add" type="submit">Add</button>
  </form>
  <button class="reset" id="reset">Reset to the example list</button>
</div>

<script>
  /* ================= EXAM DATA ================= */
  const STORAGE_KEY = "examCountdown.exams";
  // Example items, placed a set number of days from today so the demo always counts down to something
  function daysFromNow(days, hhmm) {
    const d = new Date();
    d.setDate(d.getDate() + days);
    const p2 = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${hhmm}`;
  }
  const DEFAULT_EXAMS = [
    { type: "appointment", code: "Study group", name: "Library, 2nd floor", date: daysFromNow(3, "16:00") },
    { type: "exam", code: "MATH1000", name: "Calculus (example)", date: daysFromNow(12, "09:00") },
    { type: "exam", code: "PROG1000", name: "Introduction to programming (example)", date: daysFromNow(18, "09:00") },
    { type: "exam", code: "STAT1000", name: "Statistics (example)", date: daysFromNow(27, "15:00") }
  ];
  let showType = "all";
  function loadExams() {
    let list = null;
    try { const s = localStorage.getItem(STORAGE_KEY); if (s) list = JSON.parse(s); } catch (e) {}
    if (!Array.isArray(list)) list = DEFAULT_EXAMS.slice();
    return list.map(x => ({ type: "exam", ...x }));   // older saved items were all exams
  }
  function saveExams() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(exams)); } catch (e) {} }

  let exams = loadExams();
  let doomLevel = 0;
  const pad = n => String(n).padStart(2, "0");

  function formatCountdown(ms) {
    const t = Math.floor(ms / 1000);
    return `${Math.floor(t / 86400)}d ${pad(Math.floor((t % 86400) / 3600))}h ${pad(Math.floor((t % 3600) / 60))}m ${pad(t % 60)}s`;
  }
  function formatWhen(str) {
    const d = new Date(str);
    return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" })
      + " at " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  /* ================= GENTLE QUOTES AND PROVERBS ================= */
  const QUOTES = [
    { text: "Dripping water hollows out stone.", author: "Ovid" },
    { text: "A journey of a thousand miles begins with a single step.", author: "Laozi, Tao Te Ching" },
    { text: "Nature does not hurry, yet everything is accomplished.", author: "Attributed to Laozi" },
    { text: "Fall seven times, stand up eight.", author: "Japanese proverb" },
    { text: "Little by little, one travels far.", author: "Proverb" },
    { text: "Rivers know this: there is no hurry. We shall get there some day.", author: "A. A. Milne, Winnie-the-Pooh" },
    { text: "No man ever steps in the same river twice.", author: "Heraclitus" },
    { text: "After rain comes sun.", author: "Norwegian proverb" },
    { text: "Nothing is so bad that it isn't good for something.", author: "Norwegian proverb" },
    { text: "This too shall pass.", author: "Persian proverb" },
    { text: "A smooth sea never made a skilled sailor.", author: "Proverb" },
    { text: "Rome was not built in a day.", author: "Proverb" },
    { text: "Slow and steady wins the race.", author: "Aesop" },
    { text: "The roots of education are bitter, but the fruit is sweet.", author: "Attributed to Aristotle" },
    { text: "Patience is bitter, but its fruit is sweet.", author: "Proverb" },
    { text: "Learning never exhausts the mind.", author: "Attributed to Leonardo da Vinci" },
    { text: "He who asks a question is a fool for a moment; he who does not remains a fool forever.", author: "Chinese proverb" },
    { text: "The best time to plant a tree was twenty years ago. The second best time is now.", author: "Proverb" },
    { text: "Rest if you must, but don't you quit.", author: "From the old poem \u201cDon't Quit\u201d" },
    { text: "It does not matter how slowly you go, as long as you do not stop.", author: "Proverb" }
  ];
  let lastQuote = -1;
  function showQuote() {
    const box = document.getElementById("quote");
    const first = lastQuote === -1;
    let i;
    do { i = Math.floor(Math.random() * QUOTES.length); } while (i === lastQuote);
    lastQuote = i;
    box.classList.add("fading");
    setTimeout(() => {
      document.getElementById("quoteText").textContent = QUOTES[i].text;
      document.getElementById("quoteAuthor").textContent = QUOTES[i].author;
      box.classList.remove("fading");
    }, first ? 0 : 1200);
  }

  /* ================= DEPRESSING MESSAGES ================= */
  const MESSAGES = {
    low: [
      "It is far away. So is your motivation.",
      "The days pass. The pile of slides does not shrink.",
      "You opened the textbook once. It remembers.",
      "Somewhere, a professor is writing question 4b."
    ],
    mid: [
      "The rain doesn't stop. Neither does the syllabus.",
      "Your coffee is cold. Your notes are incomplete.",
      "Every second that passes is gone forever.",
      "Your past self promised to start studying. Your past self lied."
    ],
    high: [
      "It is coming.",
      "There is no escape from WISEflow.",
      "The exam hall is cold and grey. It is waiting.",
      "It knows you didn't do the exercises.",
      "Tick. Tock. Tick. Tock."
    ]
  };
  function pickMessage() {
    const pool = doomLevel > 0.8 ? MESSAGES.high : doomLevel > 0.4 ? MESSAGES.mid : MESSAGES.low;
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function rotateMessage() {
    const el = document.getElementById("doomText");
    el.style.opacity = 0;
    setTimeout(() => { el.textContent = pickMessage(); el.style.opacity = 1; }, 1800);
  }

  /* ================= EXAM + APPOINTMENT LIST ================= */
  const TYPE_LABEL = { exam: "Exam", appointment: "Appointment" };
  function renderList() {
    const list = document.getElementById("list");
    exams.sort((a, b) => new Date(a.date) - new Date(b.date));
    const shown = exams.filter(x => showType === "all" || x.type === showType);
    if (shown.length === 0) {
      list.innerHTML = "";
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = showType === "appointment" ? "No appointments yet. Add one below."
                        : showType === "exam" ? "No exams yet. Add one below."
                        : "Nothing planned. Add an exam or appointment below.";
      list.appendChild(empty);
      return;
    }
    list.innerHTML = "";
    shown.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="info"><div><span class="code"></span><span class="tags"></span></div><div class="name"></div><div class="when"></div></div>
        <div class="countdown"></div>
        <button class="del" type="button">Remove</button>`;
      card.querySelector(".code").textContent = item.code;
      card.querySelector(".name").textContent = item.name || "";
      card.querySelector(".when").textContent = formatWhen(item.date);
      card.querySelector(".countdown").item = item;
      card.querySelector(".del").onclick = () => {
        if (confirm(`Remove ${item.code}?`)) {
          exams = exams.filter(x => x !== item);
          saveExams(); renderList(); tick();
        }
      };
      list.appendChild(card);
    });
  }

  /* ================= MAIN TICK ================= */
  function tick() {
    const now = new Date();
    document.getElementById("clock").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    document.getElementById("date").textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

    let nextFound = false;
    document.querySelectorAll(".countdown").forEach(el => {
      const item = el.item;
      if (!item) return;
      const card = el.parentElement;
      const diff = new Date(item.date) - now;
      card.classList.remove("next", "past");
      el.classList.remove("soon", "finished");
      const tags = card.querySelector(".tags");
      tags.innerHTML = "";
      const typeTag = document.createElement("span");
      typeTag.className = "tag " + item.type; typeTag.textContent = TYPE_LABEL[item.type] || "Exam";
      tags.appendChild(typeTag);
      if (diff <= 0) {
        el.textContent = "Done"; el.classList.add("finished"); card.classList.add("past");
      } else {
        el.textContent = formatCountdown(diff);
        if (diff < 3 * 86400000) el.classList.add("soon");
        if (!nextFound) {
          nextFound = true;
          card.classList.add("next");
          const b = document.createElement("span");
          b.className = "badge"; b.textContent = "NEXT";
          tags.appendChild(b);
        }
      }
    });

    // the despair meter only cares about the next exam
    const nextExam = exams.find(x => x.type === "exam" && new Date(x.date) > now);
    const days = nextExam ? (new Date(nextExam.date) - now) / 86400000 : 999;
    doomLevel = Math.min(1, Math.max(0, 1 - days / 30));
    const pct = Math.round(doomLevel * 100);
    document.getElementById("meterFill").style.width = pct + "%";
    document.getElementById("meterPct").textContent = pct + "%";
    document.getElementById("vignette").style.opacity = 0.45 + doomLevel * 0.45;

    if (soundOn && !rainOnly) playTick();
  }

  /* ================= ANIMATED RAINY POND (painted background) ================= */
  // All positions below are in the background picture's own pixels (1526 x 602).
  const sky = document.getElementById("sky");
  const g = sky.getContext("2d");
  const BG_W = 1526, BG_H = 602;
  const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const bg = new Image();
  bg.src = document.getElementById("bgData").textContent.trim();

  let W = 0, H = 0, scale = 1, offX = 0, offY = 0, drops = [];
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    sky.width = W * dpr; sky.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    // fill the screen; on phones keep the black cat in view, on wide screens the boat and cat
    scale = Math.max(W / BG_W, H / BG_H);
    const wide = W >= 700;
    const target = wide ? W * 0.84 : W / 2;   // where on screen the black cat should sit
    offX = Math.min(0, Math.max(W - BG_W * scale, target - 1063 * scale));
    offY = (H - BG_H * scale) / 2;
    makeDrops();
  }
  const sx = x => offX + x * scale, sy = y => offY + y * scale;

  // Cut a piece of the picture out with soft edges, so it can move on its own
  function sprite(x, y, w, h) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const cg = c.getContext("2d");
    cg.drawImage(bg, x, y, w, h, 0, 0, w, h);
    cg.globalCompositeOperation = "destination-in";
    cg.translate(w / 2, h / 2);
    cg.scale(w / h, 1);
    const grad = cg.createRadialGradient(0, 0, h * 0.32, 0, 0, h * 0.56);
    grad.addColorStop(0, "rgba(0,0,0,1)");
    grad.addColorStop(1, "rgba(0,0,0,0)");
    cg.fillStyle = grad;
    cg.fillRect(-h, -h, 2 * h, 2 * h);
    return { c, x, y, w, h };
  }
  let boat, cat, creature;

  const LIGHTS = [[838, 228, 34], [998, 128, 26], [1076, 128, 22], [1150, 125, 24], [1300, 125, 26], [1330, 118, 30], [1384, 110, 28], [882, 142, 16], [950, 150, 14]];
  const LEAF_TIPS = [[110, 165], [232, 168], [352, 205], [470, 330], [560, 352], [640, 440], [300, 140], [180, 300]];

  // ripples on the pond
  let ripples = [], lastBigRing = 0;
  function addRipple(x, y, big) {
    ripples.push({ x, y, r: 1, max: big ? 70 : 14 + Math.random() * 22, speed: big ? 0.35 : 0.5 + Math.random() * 0.4 });
  }
  function inWater(x, y) {
    if (y < 250) return false;
    if (y < 420) return x > 600;
    return x > 720;
  }

  // dripping water from the leaves
  let drips = LEAF_TIPS.map(t => ({ tip: t, y: t[1], vy: 0, wait: Math.random() * 3000 }));

  // rain in front of everything — several types to choose from
  const RAIN_TYPES = {
    anime:   { name: "Anime rain", density: 4,   ripples: 0.45 },
    drizzle: { name: "Drizzle",    density: 1.8, ripples: 0.12 },
    storm:   { name: "Downpour",   density: 2.2, ripples: 0.95 },
    classic: { name: "Classic",    density: 5,   ripples: 0.35 },
    glass:   { name: "Glass roof", density: 3,   ripples: 0.85 }
  };
  const RAIN_ORDER = ["glass", "anime", "drizzle", "storm", "classic"];
  let rainType = "glass";
  try { const saved = localStorage.getItem("examCountdown.rainType"); if (RAIN_TYPES[saved]) rainType = saved; } catch (e) {}
  let splashes = [];
  let glassDrops = [], glassHits = [];
  function makeDrops() {
    drops = Array.from({ length: Math.floor(W / RAIN_TYPES[rainType].density) }, () => newDrop(true));
    glassDrops = []; glassHits = [];
  }

  // Heavy rain seen through a glass roof: drops smack onto the glass, stay there, and the heavy ones run down
  function drawGlassRoof() {
    // new hits on the glass
    for (let i = 0; i < 5; i++) {
      if (Math.random() < 0.8) glassHits.push({ x: Math.random() * W, y: Math.random() * H, age: 0, r: 1.4 + Math.pow(Math.random(), 2) * 6 });
    }
    glassHits = glassHits.filter(h => {
      h.age += 0.12;
      if (h.age >= 1) {
        // the splash settles as a droplet on the glass
        glassDrops.push({ x: h.x, y: h.y, r: h.r * (0.7 + Math.random() * 0.4), vy: 0, trail: [], life: 1 });
        return false;
      }
      return true;
    });
    // keep the glass from filling up completely: the oldest droplets slowly evaporate
    if (glassDrops.length > 700) glassDrops.splice(0, glassDrops.length - 700);

    g.lineCap = "round";
    // splash rings where drops hit
    glassHits.forEach(h => {
      g.strokeStyle = `rgba(225,238,255,${0.55 * (1 - h.age)})`;
      g.lineWidth = 1;
      g.beginPath(); g.arc(h.x, h.y, h.r * (1 + h.age * 2.2), 0, Math.PI * 2); g.stroke();
      // tiny droplets thrown out by the splash
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI / 2 + h.x;
        g.fillStyle = `rgba(225,238,255,${0.5 * (1 - h.age)})`;
        g.fillRect(h.x + Math.cos(a) * h.r * (1.5 + h.age * 4), h.y + Math.sin(a) * h.r * (1.5 + h.age * 4), 1.3, 1.3);
      }
    });

    glassDrops.forEach(d => {
      // heavy droplets start running down the glass
      if (d.vy === 0 && d.r > 3 && Math.random() < 0.01) d.vy = 0.6;
      if (d.vy > 0) {
        d.vy = Math.min(d.vy + 0.08, 2.5 + d.r * 0.3);
        d.trail.push([d.x, d.y]);
        if (d.trail.length > 60) d.trail.shift();
        d.y += d.vy;
        d.x += (Math.random() - 0.5) * 0.8;
        d.r = Math.max(2, d.r - 0.004);   // leaves a little water behind
        if (Math.random() < 0.004) d.vy = 0;  // gets stuck for a moment
      } else if (d.trail.length) {
        d.trail.shift();
      }
      // the wet trail behind a running drop
      if (d.trail.length > 1) {
        g.strokeStyle = "rgba(180,200,235,0.16)";
        g.lineWidth = d.r * 0.9;
        g.beginPath();
        g.moveTo(d.trail[0][0], d.trail[0][1]);
        d.trail.forEach(q => g.lineTo(q[0], q[1]));
        g.lineTo(d.x, d.y);
        g.stroke();
      }
      // the droplet itself: dark edge, light body and a bright glint, like a little lens
      g.fillStyle = "rgba(10,20,40,0.35)";
      g.beginPath(); g.arc(d.x, d.y + d.r * 0.15, d.r * 1.05, 0, Math.PI * 2); g.fill();
      g.fillStyle = "rgba(160,185,225,0.28)";
      g.beginPath(); g.arc(d.x, d.y, d.r, 0, Math.PI * 2); g.fill();
      g.fillStyle = "rgba(240,248,255,0.75)";
      g.beginPath(); g.arc(d.x - d.r * 0.35, d.y - d.r * 0.35, Math.max(0.6, d.r * 0.28), 0, Math.PI * 2); g.fill();
    });
    glassDrops = glassDrops.filter(d => d.y < H + 20);
  }
  function newDrop(anyY) {
    // z = how close the drop is (0 = far away, 1 = right in front of you)
    return { x: Math.random() * (W + 300) - 150, y: anyY ? Math.random() * H : -60 - Math.random() * 60, z: Math.random(), r: Math.random() };
  }
  function windAngle(t) {
    if (rainType === "storm") return 0.32 + 0.22 * Math.sin(t * 0.45) + 0.08 * Math.sin(t * 1.7);
    if (rainType === "drizzle") return 0.06 + 0.04 * Math.sin(t * 0.3);
    if (rainType === "anime") return 0.07;
    if (rainType === "glass") return 0.05;
    return 0.12;
  }
  function drawRain(t) {
    const ang = windAngle(t);
    g.lineCap = "round";
    if (rainType === "classic") {
      g.strokeStyle = "rgba(190,210,255,0.32)";
      g.lineWidth = 1.1;
      g.beginPath();
      drops.forEach(d => {
        const len = 12 + d.r * 18, sp = 9 + d.r * 7;
        g.moveTo(d.x, d.y); g.lineTo(d.x - len * ang, d.y + len);
        d.y += sp; d.x -= sp * ang;
        if (d.y > H) Object.assign(d, newDrop(false));
      });
      g.stroke();
    } else if (rainType === "drizzle") {
      // fine, misty drizzle: tiny soft specks drifting slowly down
      g.fillStyle = "rgba(205,220,255,0.45)";
      drops.forEach(d => {
        const sp = 1.6 + d.z * 2.6, size = 0.6 + d.z * 1.3;
        d.x += Math.sin(t * 1.3 + d.r * 20) * 0.25 - sp * ang;
        d.y += sp;
        g.globalAlpha = 0.35 + d.z * 0.55;
        g.fillRect(d.x, d.y, size, size * 2.2);
        if (d.y > H) Object.assign(d, newDrop(false));
      });
      g.globalAlpha = 1;
    } else if (rainType === "storm") {
      // heavy, slanted downpour that swings with the wind
      [0, 1].forEach(layer => {
        g.strokeStyle = layer ? "rgba(215,228,255,0.42)" : "rgba(170,190,230,0.22)";
        g.lineWidth = layer ? 1.6 : 0.9;
        g.beginPath();
        drops.forEach(d => {
          if ((d.z > 0.55) !== !!layer) return;
          const len = 24 + d.z * 34;
          g.moveTo(d.x, d.y); g.lineTo(d.x - len * ang, d.y + len);
        });
        g.stroke();
      });
      drops.forEach(d => {
        const sp = 17 + d.z * 14;
        d.y += sp; d.x -= sp * ang;
        if (d.y > H || d.x < -200) Object.assign(d, newDrop(false));
      });
    } else if (rainType === "glass") {
      // heavy rain pouring down behind the glass
      g.strokeStyle = "rgba(200,215,245,0.22)";
      g.lineWidth = 1;
      g.beginPath();
      drops.forEach(d => {
        const len = 18 + d.z * 30, sp = 15 + d.z * 12;
        g.moveTo(d.x, d.y); g.lineTo(d.x - len * ang, d.y + len);
        d.y += sp; d.x -= sp * ang;
        if (d.y > H) Object.assign(d, newDrop(false));
      });
      g.stroke();
      // a faint wet sheen over the glass
      g.fillStyle = "rgba(20,35,60,0.12)";
      g.fillRect(0, 0, W, H);
      drawGlassRoof();
    } else {
      // anime rain: long thin streaks in layers with a bright head, like in animated films
      drops.forEach(d => {
        const len = 26 + d.z * 70, sp = 9 + d.z * 16, a = 0.12 + d.z * 0.5;
        g.lineWidth = 0.5 + d.z * 1.2;
        g.strokeStyle = `rgba(210,228,255,${a * 0.35})`;
        g.beginPath(); g.moveTo(d.x - len * ang, d.y - len); g.lineTo(d.x, d.y); g.stroke();
        g.strokeStyle = `rgba(235,244,255,${a})`;
        g.beginPath(); g.moveTo(d.x - len * 0.25 * ang, d.y - len * 0.25); g.lineTo(d.x, d.y); g.stroke();
        d.y += sp; d.x -= sp * ang;
        if (d.y > H + len) Object.assign(d, newDrop(false));
      });
    }

    // little splashes jumping up from the pond
    if (rainType === "anime" || rainType === "storm" || rainType === "glass") {
      const n = rainType === "anime" ? 1 : rainType === "glass" ? 2 : 3;
      for (let i = 0; i < n; i++) {
        const x = 600 + Math.random() * 926, y = 250 + Math.random() * 350;
        if (Math.random() < 0.7 && inWater(x, y)) splashes.push({ x, y, age: 0, size: 0.6 + Math.random() * 0.8 });
      }
    }
    splashes = splashes.filter(p => p.age < 1);
    g.fillStyle = "rgba(225,238,255,0.8)";
    splashes.forEach(p => {
      p.age += 0.06;
      const k = p.age, s2 = p.size * scale;
      [-1, -0.35, 0.35, 1].forEach(dir => {
        const px = sx(p.x) + dir * k * 9 * s2;
        const py = sy(p.y) - (Math.sin(k * Math.PI) * 10 * s2) * (1 - Math.abs(dir) * 0.3);
        g.globalAlpha = 1 - k;
        g.beginPath(); g.arc(px, py, 1.1 * s2 + 0.3, 0, Math.PI * 2); g.fill();
      });
    });
    g.globalAlpha = 1;
  }

  // the black cat blinks now and then
  let blinkUntil = 0, nextBlink = performance.now() + 2500;
  // floating "z" from the sleeping cat in the leaves
  let zs = [];
  let lastZ = 0;

  function drawShimmer(t) {
    // redraw the pond in thin strips that sway sideways, so the water looks like it moves
    for (let y = 240; y < BG_H; y += 2) {
      const depth = (y - 240) / (BG_H - 240);
      const dx = Math.sin(y * 0.11 + t * 1.6) * (0.4 + depth * 1.8) + Math.sin(y * 0.031 - t * 0.9) * 0.6;
      const x0 = y < 420 ? 600 : 720;
      g.drawImage(bg, x0, y, BG_W - x0, 2, sx(x0 + dx), sy(y), (BG_W - x0) * scale, 2 * scale + 0.5);
    }
  }

  function drawSprite(s, dx, dy, rot, px, py) {
    g.save();
    g.translate(sx(px + dx), sy(py + dy));
    g.rotate(rot);
    g.drawImage(s.c, (s.x - px) * scale, (s.y - py) * scale, s.w * scale, s.h * scale);
    g.restore();
  }

  function frame(now) {
    const t = now / 1000;
    g.clearRect(0, 0, W, H);
    g.drawImage(bg, sx(0), sy(0), BG_W * scale, BG_H * scale);
    if (!calm) drawShimmer(t);

    // ripples (rings that grow and fade)
    if (!calm && Math.random() < RAIN_TYPES[rainType].ripples) {
      const x = 600 + Math.random() * 926, y = 250 + Math.random() * 350;
      if (inWater(x, y)) addRipple(x, y, false);
    }
    if (!calm && now - lastBigRing > 1400) { addRipple(1063, 458, true); lastBigRing = now; }
    g.lineWidth = Math.max(1, scale * 1.1);
    ripples = ripples.filter(r => r.r < r.max);
    ripples.forEach(r => {
      r.r += r.speed;
      const a = (1 - r.r / r.max) * 0.5;
      g.strokeStyle = `rgba(200,220,255,${a})`;
      g.beginPath();
      g.ellipse(sx(r.x), sy(r.y), r.r * scale, r.r * 0.32 * scale, 0, 0, Math.PI * 2);
      g.stroke();
    });

    // the boat gently rocks, the black cat and the creature bob in the water
    const bob = calm ? 0 : Math.sin(t * 1.3);
    drawSprite(boat, 0, bob * 1.8, calm ? 0 : Math.sin(t * 0.9) * 0.025, 772, 290);
    drawSprite(creature, 0, calm ? 0 : Math.sin(t * 0.8 + 1) * 2, 0, 1375, 300);
    const catDy = calm ? 0 : Math.sin(t * 1.1 + 2) * 2.2;
    drawSprite(cat, 0, catDy, 0, 1063, 462);
    if (now > nextBlink) { blinkUntil = now + 150; nextBlink = now + 2500 + Math.random() * 4000; }
    if (now < blinkUntil) {
      g.fillStyle = "#0a1428";
      [[1026, 437], [1084, 439]].forEach(([ex, ey]) => {
        g.beginPath(); g.ellipse(sx(ex), sy(ey + catDy), 16 * scale, 15 * scale, 0, 0, Math.PI * 2); g.fill();
        g.strokeStyle = "rgba(170,180,200,0.8)"; g.lineWidth = Math.max(1, 1.5 * scale);
        g.beginPath(); g.moveTo(sx(ex - 11), sy(ey + 2 + catDy)); g.quadraticCurveTo(sx(ex), sy(ey + 8 + catDy), sx(ex + 11), sy(ey + 2 + catDy)); g.stroke();
      });
    }

    // warm lantern and window lights that flicker
    g.globalCompositeOperation = "lighter";
    LIGHTS.forEach(([x, y, r], i) => {
      const f = 0.16 + 0.07 * Math.sin(t * (3 + i) + i * 2) + (calm ? 0 : Math.random() * 0.05);
      const yy = i === 0 ? y + bob * 1.8 : y;
      const grad = g.createRadialGradient(sx(x), sy(yy), 0, sx(x), sy(yy), r * scale);
      grad.addColorStop(0, `rgba(255,200,110,${f})`);
      grad.addColorStop(1, "rgba(255,200,110,0)");

      g.beginPath(); g.arc(sx(x), sy(yy), r * scale, 0, Math.PI * 2); g.fill();
    });

    // drops falling from the leaf tips
    drips.forEach(d => {
      if (d.wait > 0) { d.wait -= 16; return; }
      d.vy += 0.25; d.y += d.vy;
      g.fillStyle = "rgba(210,225,255,0.75)";
      g.beginPath(); g.ellipse(sx(d.tip[0]), sy(d.y), 2 * scale, 3 * scale, 0, 0, Math.PI * 2); g.fill();
      if (d.y > d.tip[1] + 140) { d.y = d.tip[1]; d.vy = 0; d.wait = 1500 + Math.random() * 3500; }
    });

    // sleepy "z" floating up from the cat hiding in the leaves
    if (!calm && now - lastZ > 1800) { zs.push({ x: 340, y: 365, age: 0 }); lastZ = now; }
    zs = zs.filter(z => z.age < 1);
    g.font = `italic ${Math.round(18 * scale)}px Georgia, serif`;
    zs.forEach(z => {
      z.age += 0.006;

      g.fillStyle = `rgba(230,236,255,${a})`;
      g.fillText("z", sx(z.x + z.age * 40 + Math.sin(z.age * 9) * 6), sy(z.y - z.age * 90));
    });

    requestAnimationFrame(frame);
  }

  bg.onload = () => {

  /* ================= LIGHTNING ================= */
  function lightning() {

  /* ================= SOUND (all generated in code) ================= */
  let ctx = null, master = null, loopNodes = [], soundOn = false;
  let rainOnly = true;   // just the rain and thunder, like a sleep-sounds recording
  try { const v = localStorage.getItem("examCountdown.rainOnly"); if (v !== null) rainOnly = v === "1"; } catch (e) {}
  let heartbeatTimer = null, eventTimer = null;

  function initAudio() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();

  function noiseBuffer(sec) {
    const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate);

  // Low, sad minor-chord drone (A minor)

    const f = ctx.createBiquadFilter();
    f.type = "lowpass"; f.frequency.value = 300;

    gn.gain.value = 0; gn.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 5);

      o.type = "triangle"; o.frequency.value = fr;

    });

    lfo.frequency.value = 0.05; lg.gain.value = 120;
    lfo.connect(lg).connect(f.frequency); lfo.start(); loopNodes.push(lfo);
    f.connect(gn).connect(master); loopNodes.push(gn);
  }


  /* ---------- RAIN SOUNDS: one sound for each rain type ---------- */
  let rainBus = null, rainNodes = [], rainTimers = new Set();

  // deeper, softer noise ("brown noise") for the roar of heavy rain
  function brownBuffer(sec) {
    const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate);
    const d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) {
      last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
      d[i] = last * 3.5;
    }
    return b;
  }

  // a never-ending layer of filtered noise that slowly swells
  function rainLayer(type, freq, q, vol, brown) {
    const src = ctx.createBufferSource();
    src.buffer = brown ? brownBuffer(5) : noiseBuffer(4); src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const gn = ctx.createGain();
    gn.gain.value = vol;
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.frequency.value = 0.05 + Math.random() * 0.08; lg.gain.value = vol * 0.35;
    lfo.connect(lg).connect(gn.gain); lfo.start();
    src.connect(f).connect(gn).connect(rainBus);
    src.start(); rainNodes.push(src, lfo);
  }


  // repeating small sounds (drops on leaves, plinks in the pond) at random intervals
  function every(minMs, maxMs, fn, waitFirst) {
    const next = () => {
      const id = setTimeout(() => { rainTimers.delete(id); loop(); }, minMs + Math.random() * (maxMs - minMs));
      rainTimers.add(id);
    };
    const loop = () => {
      if (!soundOn || !rainBus) return;
      fn(ctx.currentTime);
      next();
    };
    if (waitFirst) next(); else loop();
  }
  // a drop hitting a leaf: a tiny soft tap
  function tap(t, vol, freq) {
    const src = ctx.createBufferSource();
    src.buffer = tapBuffer;
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq * (0.7 + Math.random() * 0.6); f.Q.value = 1.5;
    const gn = ctx.createGain(); gn.gain.value = vol * (0.4 + Math.random() * 0.6);
    src.connect(f).connect(gn).connect(rainBus); src.start(t);
  }
  let tapBuffer = null;

  // a sharp tick of one drop on glass, placed left or right so it sounds all around you
  function glassTick(t, vol) {
    const src = ctx.createBufferSource();
    src.buffer = tapBuffer;
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 3500 + Math.random() * 4500; f.Q.value = 3 + Math.random() * 4;
    const gn = ctx.createGain(); gn.gain.value = vol;
    let node = src.connect(f).connect(gn);
    if (ctx.createStereoPanner) {
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.random() * 1.8 - 0.9;
      node = node.connect(pan);
    }
    node.connect(rainBus);
    src.start(t);
  }
  // a fat drop hitting the glass: a short bright "plock"
  function glassPlock(t) {
    const o = ctx.createOscillator(), gn = ctx.createGain();
    const f0 = 2200 + Math.random() * 2200;
    o.type = "triangle";
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.7, t + 0.05);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(0.03 + Math.random() * 0.03, t + 0.003);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    let node = o.connect(gn);
    if (ctx.createStereoPanner) {
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.random() * 1.6 - 0.8;
      node = node.connect(pan);
    }
    node.connect(rainBus);
    o.start(t); o.stop(t + 0.08);
    tap(t, 0.06, 5000);
  }
  // water gurgling down the gutter: soft little bubbles
  function gutter(t) {
    const o = ctx.createOscillator(), gn = ctx.createGain(), f = ctx.createBiquadFilter();
    const f0 = 250 + Math.random() * 450;
    o.type = "sine";
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f0 * 1.6, t + 0.05);
    f.type = "lowpass"; f.frequency.value = 1200;
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(0.012 + Math.random() * 0.012, t + 0.01);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(f).connect(gn).connect(rainBus);
    o.start(t); o.stop(t + 0.1);
  }

  // a wide, steady layer of rain: two separate noise sources, one in each ear
  function stereoRain(type, freq, q, vol, brown) {
    [-0.8, 0.8].forEach(side => {
      const src = ctx.createBufferSource();
      src.buffer = brown ? brownBuffer(5 + Math.random()) : noiseBuffer(4 + Math.random());
      src.loop = true;
      const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq * (0.92 + Math.random() * 0.16); f.Q.value = q;
      const gn = ctx.createGain(); gn.gain.value = vol * 0.6;
      // only a very slow, small swell, so it stays steady like a real downpour
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 0.03 + Math.random() * 0.04; lg.gain.value = vol * 0.08;
      lfo.connect(lg).connect(gn.gain); lfo.start();
      let node = src.connect(f).connect(gn);
      if (ctx.createStereoPanner) { const pan = ctx.createStereoPanner(); pan.pan.value = side; node = node.connect(pan); }
      node.connect(rainBus);
      src.start(); rainNodes.push(src, lfo);
    });
  }


  /* ---------- MORE RAIN SOUNDS (pick one from the menu) ---------- */
  // softer noise types: "pink" is warmer than plain hiss, "brown" is deep and soft
  const noiseCache = {};
  function makeNoise(kind, variant) {
    const key = kind + variant;
    if (noiseCache[key]) return noiseCache[key];
    const len = Math.floor(ctx.sampleRate * (5 + variant * 0.7));
    const b = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = b.getChannelData(0);
    if (kind === "pink") {
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
        b6 = w * 0.115926;
      }
    } else if (kind === "brown") {
      let last = 0;
      for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    } else {
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    // fade the loop point so there is no click when it repeats
    const fade = Math.floor(ctx.sampleRate * 0.05);
    for (let i = 0; i < fade; i++) { const k = i / fade; d[i] *= k; d[len - 1 - i] *= k; }
    return (noiseCache[key] = b);
  }
  // a steady bed of rain: noise through one or more filters, in stereo unless asked otherwise
  function bed(kind, filters, vol, mono) {
    const sides = mono ? [0] : [-0.7, 0.7];
    sides.forEach((side, i) => {
      const src = ctx.createBufferSource();
      src.buffer = makeNoise(kind, i); src.loop = true;
      let node = src;
      filters.forEach(([type, freq, q]) => {
        const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q || 0.7;
        node = node.connect(f);
      });
      const gn = ctx.createGain(); gn.gain.value = vol / sides.length;
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 0.03 + Math.random() * 0.05; lg.gain.value = (vol / sides.length) * 0.1;
      lfo.connect(lg).connect(gn.gain); lfo.start();
      node = node.connect(gn);
      if (!mono && ctx.createStereoPanner) { const pan = ctx.createStereoPanner(); pan.pan.value = side; node = node.connect(pan); }
      node.connect(rainBus);
      src.start(0, Math.random() * 3);   // start the two sides at different places
      rainNodes.push(src, lfo);
    });
  }
  // one short noise burst through a filter: a single drop, tap, ping or crackle
  let crackleBuffer = null;
  function hit(t, opts) {
    const src = ctx.createBufferSource();
    src.buffer = opts.short ? crackleBuffer : tapBuffer;
    const f = ctx.createBiquadFilter();
    f.type = opts.type || "bandpass";
    f.frequency.value = opts.freq[0] + Math.random() * (opts.freq[1] - opts.freq[0]);
    f.Q.value = opts.q || 1;
    let node = src.connect(f);
    if (opts.muffle) { const m = ctx.createBiquadFilter(); m.type = "lowpass"; m.frequency.value = opts.muffle; node = node.connect(m); }
    const gn = ctx.createGain(); gn.gain.value = opts.vol[0] + Math.random() * (opts.vol[1] - opts.vol[0]);
    node = node.connect(gn);
    if (ctx.createStereoPanner) { const pan = ctx.createStereoPanner(); pan.pan.value = (Math.random() * 2 - 1) * (opts.width === undefined ? 0.8 : opts.width); node = node.connect(pan); }
    node.connect(rainBus);
    src.start(t);
  }

  // The list in the menu: key, name, and how loud it plays (so they are all about equally loud)
  const SOUND_LIST = [
    ["soft",    "Gentle rain",               3.3],
    ["distant", "Rainy evening indoors",     2.0],
    ["garden",  "Dripping garden",           3.8],
    ["glass",   "Thunder on the glass roof", 2]
  ];
  let rainSound = "soft";
  try { const v = localStorage.getItem("examCountdown.rainSound"); if (SOUND_LIST.some(x => x[0] === v)) rainSound = v; } catch (e) {}

  const RAIN_SOUNDS = {
    // calm, warm, even rain
    soft() {
      bed("pink", [["highpass", 180], ["lowpass", 3200]], 0.16);
      bed("brown", [["lowpass", 400]], 0.07);
      every(25, 70, t => hit(t, { freq: [2200, 3800], q: 1.5, vol: [0.004, 0.012] }));
    },
    // rain in the garden, with water dripping slowly from the gutter
    garden() {
      bed("pink", [["highpass", 180], ["lowpass", 3000]], 0.13);
      bed("brown", [["lowpass", 380]], 0.06);
      every(700, 1600, t => hit(t, { freq: [500, 800], q: 2, vol: [0.02, 0.035], muffle: 1200, width: 0.5 }));
    },
    // rain heard from inside a house: muffled and deep, with thunder far away
    distant() {
      bed("brown", [["lowpass", 650]], 0.2);
      bed("pink", [["highpass", 150], ["lowpass", 1300]], 0.08);
      every(25000, 50000, () => playThunder(false), true);
    },
    // heavy rain drumming on a glass roof: sharp ticks all around, a hollow hum from the glass panes,
    // bigger drops that "plock", and water running in the gutter
    glass() {
      stereoRain("bandpass", 2200, 0.45, 0.10);        // the dense wash of heavy rain on glass
      stereoRain("highpass", 5500, 0.6, 0.035);        // the bright sizzle of drops on the panes
      stereoRain("lowpass", 700, 0.6, 0.09, true);     // a thick, steady roar
      rainLayer("lowpass", 160, 0.7, 0.12, true);      // deep body of the downpour
      every(3, 9, t => glassTick(t, 0.008 + Math.random() * 0.02));   // countless tiny drops that blur together
      every(600, 1800, t => glassPlock(t));            // now and then a fat drop
      every(90, 260, t => gutter(t));                  // water running off the roof
      every(18000, 40000, () => playThunder(), true);  // rolling thunder
    }
  };

  function stopRain(fade) {
    rainTimers.forEach(clearTimeout); rainTimers.clear();
    const oldBus = rainBus, oldNodes = rainNodes;
    rainBus = null; rainNodes = [];
    if (!oldBus) return;
    const t = ctx.currentTime;
    oldBus.gain.cancelScheduledValues(t);
    oldBus.gain.setValueAtTime(oldBus.gain.value, t);
    oldBus.gain.linearRampToValueAtTime(0, t + fade);
    setTimeout(() => {
      oldNodes.forEach(n => { try { n.stop(); } catch (e) {} });
      oldBus.disconnect();
    }, fade * 1000 + 100);
  }
  function startRain() {
    if (!crackleBuffer) {
      crackleBuffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.006), ctx.sampleRate);
      const c = crackleBuffer.getChannelData(0);
      for (let i = 0; i < c.length; i++) c[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / c.length, 2);
    }
    if (!tapBuffer) {
      tapBuffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.03), ctx.sampleRate);
      const d = tapBuffer.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
    }
    rainBus = ctx.createGain();
    rainBus.gain.value = 0;
    // the glass roof is a heavy downpour, so it plays louder than the other rain types
    const loud = (SOUND_LIST.find(x => x[0] === rainSound) || [0, 0, 1])[2];
    rainBus.gain.linearRampToValueAtTime(loud, ctx.currentTime + 2.5); // soft fade in
    rainBus.connect(master);
    RAIN_SOUNDS[rainSound]();
  }
  // crossfade to the sound of the newly chosen rain type
  function switchRainSound() {
    if (!soundOn || !ctx) return;

    startRain();
  }

  // Soft pad that slowly changes chord, so there's always music under the rain
  let padTimer = null;
  const CHORDS = [
    [110, 130.8, 164.8],   // A minor
    [87.3, 110, 130.8],    // F major
    [98, 123.5, 146.8],    // G major
    [82.4, 98, 123.5]      // E minor
  ];
  let chordIndex = 0;
  function padLoop() {
    if (!soundOn || rainOnly) return;
    const t = ctx.currentTime, len = 8;
    CHORDS[chordIndex].forEach(fr => {
      const o = ctx.createOscillator(), gn = ctx.createGain(), f = ctx.createBiquadFilter();
      o.type = "sawtooth"; o.frequency.value = fr; o.detune.value = (Math.random() - 0.5) * 12;
      f.type = "lowpass"; f.frequency.value = 600;
      gn.gain.setValueAtTime(0, t);
      gn.gain.linearRampToValueAtTime(0.025, t + 3);   // fade in
      gn.gain.linearRampToValueAtTime(0.025, t + len - 1);
      gn.gain.linearRampToValueAtTime(0, t + len + 2); // overlaps with next chord
      o.connect(f).connect(gn).connect(master);
      o.start(t); o.stop(t + len + 2.1);

    padTimer = setTimeout(padLoop, len * 1000);
  }

  // Lonely piano notes that keep playing slowly, forever
  let pianoTimer = null;
  const SCALE = [220, 246.9, 261.6, 293.7, 329.6, 349.2, 392, 440, 523.3];
  let pianoPos = 7;
  function pianoLoop() {
    if (!soundOn || rainOnly) return;
    // wander mostly downward through A minor, like a sad melody
    pianoPos = Math.min(SCALE.length - 1, Math.max(0, pianoPos + [-2, -1, -1, 0, 1, 2][Math.floor(Math.random() * 6)]));
    pianoNote(SCALE[pianoPos], ctx.currentTime, 0.09);

  // the sky lights up for a moment
  function flashLightning() {
    const el = document.getElementById("lightning");
    [[0, 0.3], [70, 0], [140, 0.45], [210, 0], [380, 0.15], [460, 0]].forEach(([d, o]) => setTimeout(() => el.style.opacity = o, d));
  }

  // Long, rolling thunder. Far away it is a soft grumble; close by it starts with a crack and a flash.
  function playThunder(near) {
    if (!soundOn) return;
    if (near === undefined) near = Math.random() < 0.35;
    const t = ctx.currentTime;
    const len = near ? 9 + Math.random() * 4 : 12 + Math.random() * 7;
    const src = ctx.createBufferSource();
    src.buffer = brownBuffer(len + 1);
    const f = ctx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.setValueAtTime(near ? 650 : 300, t);
    f.frequency.exponentialRampToValueAtTime(near ? 120 : 80, t + len);
    const boom = ctx.createBiquadFilter(); boom.type = "lowshelf"; boom.frequency.value = 120; boom.gain.value = 6;
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(0.0001, t);
    // several rumbles of different strength, rolling across the sky
    const peak = near ? 0.85 : 0.4;
    let time = t + (near ? 0.05 : 0.9 + Math.random());
    gn.gain.linearRampToValueAtTime(peak * (near ? 1 : 0.6), time);
    const rumbles = 3 + Math.floor(Math.random() * 4);
    for (let i = 0; i < rumbles; i++) {
      time = Math.min(time + 0.7 + Math.random() * 2, t + len - 1.5);
      gn.gain.linearRampToValueAtTime(peak * (0.3 + Math.random() * 0.7) * (1 - i / (rumbles + 1)), time);
    }
    gn.gain.linearRampToValueAtTime(0.0001, t + len);
    let node = src.connect(f).connect(boom).connect(gn);
    if (ctx.createStereoPanner) { const pan = ctx.createStereoPanner(); pan.pan.value = Math.random() * 0.8 - 0.4; node = node.connect(pan); }
    node.connect(master);
    src.start(t); src.stop(t + len + 0.5);

    if (near) {
      // the sharp crack right at the start
      const crack = ctx.createBufferSource();
      crack.buffer = noiseBuffer(1);
      const cf = ctx.createBiquadFilter(); cf.type = "bandpass"; cf.frequency.value = 1400; cf.Q.value = 0.5;
      const cg = ctx.createGain();
      cg.gain.setValueAtTime(0.22, t);
      cg.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      crack.connect(cf).connect(cg).connect(master);
      crack.start(t); crack.stop(t + 0.7);
      flashLightning();
      sink();
    }
  }

  // Slow, heavy heartbeat
  function thump(time, vol) {
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(60, time); o.frequency.exponentialRampToValueAtTime(30, time + 0.18);
    gn.gain.setValueAtTime(vol, time); gn.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
    o.connect(gn).connect(master); o.start(time); o.stop(time + 0.35);
  }
  function heartbeatLoop() {
    if (!soundOn || rainOnly) return;
    const t = ctx.currentTime, vol = 0.2 + doomLevel * 0.4;
    thump(t, vol); thump(t + 0.25, vol * 0.6);
    heartbeatTimer = setTimeout(heartbeatLoop, 2000 - doomLevel * 1300);
  }

  function playTick() {
    const t = ctx.currentTime, o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = "square"; o.frequency.value = 1300;
    gn.gain.setValueAtTime(0.012, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    o.connect(gn).connect(master); o.start(t); o.stop(t + 0.04);
  }

  // A lonely piano note
  function pianoNote(freq, time, vol) {
    [1, 2, 3].forEach((h, i) => {
      const o = ctx.createOscillator(), gn = ctx.createGain();
      o.type = "sine"; o.frequency.value = freq * h;
      gn.gain.setValueAtTime(0, time);
      gn.gain.linearRampToValueAtTime(vol / (i * 2 + 1), time + 0.01);
      gn.gain.exponentialRampToValueAtTime(0.0001, time + 3.5);
      o.connect(gn).connect(master); o.start(time); o.stop(time + 3.6);
    });
  }
  // Sad falling melody in A minor
  function playSadPiano() {
    const phrases = [
      [440, 392, 329.6, 293.7],
      [523.3, 493.9, 440, 329.6],
      [329.6, 293.7, 261.6, 220],
      [392, 349.2, 329.6, 220]
    ];
    const p = phrases[Math.floor(Math.random() * phrases.length)];
    const t = ctx.currentTime;
    p.forEach((f, i) => pianoNote(f, t + i * 0.9, 0.12));
  }

  function playWhisper() {
    const t = ctx.currentTime, src = ctx.createBufferSource();
    src.buffer = noiseBuffer(4);
    const f = ctx.createBiquadFilter();
    f.type = "bandpass"; f.Q.value = 8;
    f.frequency.setValueAtTime(350, t); f.frequency.linearRampToValueAtTime(1100, t + 1.8); f.frequency.linearRampToValueAtTime(500, t + 3.5);
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(0.3, t + 1.4); gn.gain.linearRampToValueAtTime(0, t + 3.8);
    src.connect(f).connect(gn).connect(master); src.start(t);
  }

  // Distant, slow bell
  function playBell() {
    const t = ctx.currentTime;
    [87.3, 174.6, 207.7, 261.6, 392].forEach((fr, i) => {
      const o = ctx.createOscillator(), gn = ctx.createGain();
      o.type = "sine"; o.frequency.value = fr;
      gn.gain.setValueAtTime(0.14 / (i + 1), t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 7);
      o.connect(gn).connect(master); o.start(t); o.stop(t + 7);
    });
  }

  // Screen briefly sinks into darker blue
  function sink() {
    const wrap = document.getElementById("wrap");
    wrap.classList.remove("shake"); void wrap.offsetWidth; wrap.classList.add("shake");
    const fl = document.getElementById("flash");
    fl.style.opacity = 0.35; setTimeout(() => fl.style.opacity = 0, 400);
  }

  function eventLoop() {
    if (!soundOn || rainOnly) return;
    const r = Math.random();
    if (r < 0.6) playWhisper();
    else { playBell(); sink(); }
    rotateMessage();
    const wait = (25000 - doomLevel * 12000) * (0.5 + Math.random() * 0.5);
    eventTimer = setTimeout(eventLoop, Math.max(8000, wait));
  }

  function startSound() {
    if (!ctx) initAudio();
    ctx.resume();
    soundOn = true;
    startRain();
    if (!rainOnly) {
      startDrone(); heartbeatLoop();
      padLoop();
      setTimeout(pianoLoop, 2500);
      eventTimer = setTimeout(eventLoop, 12000);
    }
    updateButton();
  }
  function stopSound() {
    stopRain(0.3);
    soundOn = false;
    [heartbeatTimer, eventTimer, padTimer, pianoTimer].forEach(clearTimeout);
    loopNodes.forEach(n => { try { n.stop ? n.stop() : n.disconnect(); } catch (e) {} });
    loopNodes = [];
    updateButton();
  }
  function updateButton() {
    const btn = document.getElementById("soundBtn");
    btn.textContent = soundOn ? "Make it stop" : "Let the rain in";
    btn.classList.toggle("on", soundOn);
    document.getElementById("hint").style.opacity = soundOn ? 0 : 1;
  }

  let userMuted = false;
  document.getElementById("soundBtn").addEventListener("click", e => {
    e.stopPropagation();
    if (soundOn) { userMuted = true; stopSound(); }
    else { userMuted = false; startSound(); }
  });

  // Browsers block sound until the first interaction, so start it on any click or key
  function autoStart() {
    if (!soundOn && !userMuted) startSound();
    ["click", "keydown", "touchstart"].forEach(ev => document.removeEventListener(ev, autoStart));
  }
  ["click", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, autoStart));

  // If the browser pauses audio (e.g. switching tabs), resume it when you come back
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && soundOn && ctx && ctx.state !== "running") ctx.resume();
  });

  /* ================= PICK A RAIN SOUND ================= */
  const soundSelect = document.getElementById("soundSelect");
  SOUND_LIST.forEach(([key, name]) => {
    const o = document.createElement("option");
    o.value = key; o.textContent = name;
    soundSelect.appendChild(o);
  });
  soundSelect.value = rainSound;
  soundSelect.addEventListener("change", () => {
    rainSound = soundSelect.value;
    try { localStorage.setItem("examCountdown.rainSound", rainSound); } catch (e) {}
    userMuted = false;
    if (soundOn) switchRainSound(); else startSound();   // picking a sound plays it straight away
  });

  /* ================= ONLY RAIN / RAIN WITH MUSIC ================= */
  const rainOnlyBtn = document.getElementById("rainOnlyBtn");
  function showRainOnly() { rainOnlyBtn.textContent = "Only rain: " + (rainOnly ? "on" : "off"); }
  showRainOnly();
  rainOnlyBtn.addEventListener("click", () => {
    rainOnly = !rainOnly;
    try { localStorage.setItem("examCountdown.rainOnly", rainOnly ? "1" : "0"); } catch (e) {}
    showRainOnly();
    if (soundOn) { stopSound(); startSound(); }
  });

  /* ================= WATCH THE RAIN (hide the UI) ================= */
  document.getElementById("watchBtn").addEventListener("click", e => {
    const on = document.body.classList.toggle("watching");
    e.currentTarget.textContent = on ? "Back to the list" : "Watch the rain";
  });

  /* ================= CHOOSE RAIN TYPE ================= */
  const rainBtn = document.getElementById("rainBtn");
  function showRainType() { rainBtn.textContent = "Rain look: " + RAIN_TYPES[rainType].name; }
  showRainType();
  rainBtn.addEventListener("click", () => {
    rainType = RAIN_ORDER[(RAIN_ORDER.indexOf(rainType) + 1) % RAIN_ORDER.length];
    try { localStorage.setItem("examCountdown.rainType", rainType); } catch (e) {}
    makeDrops();
    showRainType();
  });

  /* ================= FORM ================= */
  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const type = document.getElementById("type").value;
    const code = document.getElementById("code").value.trim();
    const name = document.getElementById("name").value.trim();
    const day = document.getElementById("day").value;
    const time = document.getElementById("time").value;
    const error = document.getElementById("error");
    if (!code || !day || !time) { error.textContent = "Please fill in a title, date and time."; return; }
    error.textContent = "";
    exams.push({ type, code: type === "exam" ? code.toUpperCase() : code, name, date: `${day}T${time}` });
    saveExams(); renderList(); tick();
    if (soundOn) { playBell(); sink(); }
    e.target.reset();
    document.getElementById("type").value = type;   // keep the type you just used
    document.getElementById("time").value = "09:00";
  });

  document.getElementById("reset").addEventListener("click", () => {
    if (confirm("Go back to the example list? Everything you added will be removed.")) { exams = DEFAULT_EXAMS.slice(); saveExams(); renderList(); tick(); }
  });

  // show all, only exams, or only appointments
  document.querySelectorAll("#filter button").forEach(btn => {
    btn.addEventListener("click", () => {
      showType = btn.dataset.show;
      document.querySelectorAll("#filter button").forEach(b => b.classList.toggle("active", b === btn));
      renderList(); tick();
    });
  });

  /* ================= START ================= */
  renderList();
  tick();
  showQuote();
  let quoteTimer = setInterval(showQuote, 20000);
  // click the quote to see another one
  document.getElementById("quote").addEventListener("click", () => {
    clearInterval(quoteTimer);
    showQuote();
    quoteTimer = setInterval(showQuote, 20000);
  });
  document.getElementById("doomText").textContent = pickMessage();
  setInterval(tick, 1000);
  setInterval(() => { if (!soundOn) rotateMessage(); }, 14000);
</script>
</body>
